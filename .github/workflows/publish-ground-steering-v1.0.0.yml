name: Publish Ground Steering v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-ground-steering-v1.0.0.yml

permissions:
  contents: write

jobs:
  publish:
    name: Publish Ground Steering release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release sources
        uses: actions/checkout@v4

      - name: Verify userscript version and build ZIP asset
        shell: bash
        run: |
          grep -qF '// @version      1.0.0' ground-steering/GeoFS_Ground_Steering_v1.0.0.user.js
          mkdir -p dist
          (
            cd ground-steering
            zip -9 ../dist/GeoFS_Ground_Steering_v1.0.0.zip GeoFS_Ground_Steering_v1.0.0.user.js README.md
          )

      - name: Publish GitHub tag, release notes and ZIP asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ground-steering-v1.0.0 >/dev/null 2>&1; then
            echo "Release already exists; no changes made."
            exit 0
          fi
          gh release create ground-steering-v1.0.0 \
            dist/GeoFS_Ground_Steering_v1.0.0.zip \
            --target "$GITHUB_SHA" \
            --title "GeoFS Ground Steering v1.0.0" \
            --notes-file ground-steering/RELEASE_NOTES_v1.0.0.md
